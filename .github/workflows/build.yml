name: build
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      experimental:
        description: Publish an experimental prerelease from the selected branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        shell: bash
        env:
          CREATE_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          EXPERIMENTAL: ${{ github.event_name == 'workflow_dispatch' && inputs.experimental }}
        run: |
          if [ "$EXPERIMENTAL" = "true" ]; then
            version="$(node scripts/release-version.js)-experimental.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          elif [ "$CREATE_RELEASE" = "true" ]; then
            version=$(node scripts/release-version.js)
          else
            version=$(node -p "require('./package.json').version")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify native build architecture
        run: node -e "require('node:assert/strict').equal(process.arch, '${{ matrix.arch }}')"
      - name: Select Xcode 26 for Intel icon compilation
        if: matrix.os == 'macos-15-intel'
        run: sudo xcode-select --switch /Applications/Xcode_26.0.1.app/Contents/Developer
      - run: npm ci
      - run: npm version "$APP_VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
      - run: npm test
        env:
          A22_TEST_EXPORT: ${{ runner.os == 'macOS' && '1' || '0' }}
          A22_TEST_MEDIA: '1'
      - name: Build installers
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          EXPERIMENTAL: ${{ github.event_name == 'workflow_dispatch' && inputs.experimental }}
        run: |
          options=()
          if [ "$EXPERIMENTAL" = "true" ]; then
            options+=(--config.productName="AMP22 Experimental" --config.appId=com.apulianas.amp22.experimental)
            options+=('--config.artifactName=AMP22-Experimental-${version}-${arch}.${ext}')
          fi
          npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never "${options[@]}"
      - name: Verify packaged macOS architectures and media tools
        if: runner.os == 'macOS'
        shell: bash
        env:
          APP_ARCH: ${{ matrix.arch }}
          EXPERIMENTAL: ${{ github.event_name == 'workflow_dispatch' && inputs.experimental }}
        run: |
          product="AMP22"
          if [ "$EXPERIMENTAL" = "true" ]; then product="AMP22 Experimental"; fi
          if [ "$APP_ARCH" = "arm64" ]; then
            contents="dist/mac-arm64/$product.app/Contents"
            cpu="arm64"
          else
            contents="dist/mac/$product.app/Contents"
            cpu="x86_64"
          fi
          media="$contents/Resources/app.asar.unpacked/node_modules"
          ffmpeg="$media/ffmpeg-static/ffmpeg"
          ffprobe="$media/ffprobe-static/bin/darwin/$APP_ARCH/ffprobe"
          for binary in "$contents/MacOS/$product" "$ffmpeg"; do
            file "$binary"
            file -b "$binary" | grep -q "$cpu"
          done
          file "$ffprobe"
          if [ "$APP_ARCH" = "x64" ]; then
            file -b "$ffprobe" | grep -q "$cpu"
          fi
          "$ffmpeg" -version > /dev/null
          "$ffprobe" -version > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: amp22-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe

  release:
    if: (github.event_name == 'workflow_dispatch' && inputs.experimental) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/master')
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: amp22-*
          merge-multiple: true
          path: release
      - name: Publish installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          EXPERIMENTAL: ${{ github.event_name == 'workflow_dispatch' && inputs.experimental }}
        run: |
          tag="v$APP_VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            options=(--latest)
            title="AMP22 $tag"
            if [ "$EXPERIMENTAL" = "true" ]; then
              options=(--prerelease --latest=false)
              title="AMP22 Experimental $tag"
            fi
            gh release create "$tag" release/* \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --generate-notes \
              "${options[@]}"
          fi
