name: build
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        shell: bash
        env:
          CREATE_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        run: |
          if [ "$CREATE_RELEASE" = "true" ]; then
            version=$(node scripts/release-version.js)
          else
            version=$(node -p "require('./package.json').version")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify native build architecture
        run: node -e "require('node:assert/strict').equal(process.arch, '${{ matrix.arch }}')"
      - name: Select Xcode 26 for Intel icon compilation
        if: matrix.os == 'macos-15-intel'
        run: sudo xcode-select --switch /Applications/Xcode_26.0.1.app/Contents/Developer
      - run: npm ci
      - run: npm version "$APP_VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
      - run: npm test
        env:
          A22_TEST_EXPORT: ${{ runner.os == 'macOS' && '1' || '0' }}
      - name: Package installer (ad-hoc signing on macOS)
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify packaged macOS architectures and media tools
        if: runner.os == 'macOS'
        shell: bash
        env:
          APP_ARCH: ${{ matrix.arch }}
        run: |
          if [ "$APP_ARCH" = "arm64" ]; then
            contents="dist/mac-arm64/AMP22.app/Contents"
            cpu="arm64"
          else
            contents="dist/mac/AMP22.app/Contents"
            cpu="x86_64"
          fi
          media="$contents/Resources/app.asar.unpacked/node_modules"
          ffmpeg="$media/ffmpeg-static/ffmpeg"
          ffprobe="$media/@derhuerst/ffprobe-static/ffprobe"
          for binary in "$contents/MacOS/AMP22" "$ffmpeg" "$ffprobe"; do
            file "$binary"
            lipo -verify_arch "$cpu" "$binary"
          done
          if [ "$APP_ARCH" = "arm64" ]; then
            helper="$contents/Resources/native/amp22-foundation-models"
            lipo -verify_arch arm64 "$helper"
            codesign --verify --strict "$helper"
          fi
          "$ffmpeg" -version > /dev/null
          "$ffprobe" -version > /dev/null
      - name: Verify ad-hoc signature of the app shipped in the DMG
        if: runner.os == 'macOS'
        run: node scripts/verify-mac-release.js "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: amp22-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test participation collector and CSV schema
        run: node --test test/participation.test.js test/extension.test.js
      - run: npm run build:extension
      - name: Package shared browser extension
        run: cd out/nflpro-extension && zip -q -r ../AMP22-NFL-Pro-Extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: amp22-nflpro-extension
          if-no-files-found: error
          path: out/AMP22-NFL-Pro-Extension.zip

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [version, build, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: amp22-*
          merge-multiple: true
          path: release
      - name: Publish installers and optional browser extension
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$APP_VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release view "$tag" --json body > release-notes.json
            node scripts/mac-release-notice.js --release-json release-notes.json > release-notes.md
            gh release edit "$tag" --notes-file release-notes.md
            gh release upload "$tag" release/* --clobber
          else
            node scripts/mac-release-notice.js > release-notes.md
            gh release create "$tag" release/* \
              --target "$GITHUB_SHA" \
              --title "AMP22 $tag" \
              --notes-file release-notes.md \
              --generate-notes \
              --latest
          fi
